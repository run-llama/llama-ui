name: Deploy workflow-debugger

on:
  repository_dispatch:
    types: [deploy-workflow-debugger]
  workflow_dispatch: 
    inputs:
      version:
        description: "Version to deploy"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          owner: run-llama
          # Only what the dispatch below needs: repository_dispatch on workflows-py.
          repositories: workflows-py
          permission-contents: write

      - name: Dispatch to workflows-py
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: run-llama/workflows-py
          event-type: debugger-assets-update
          client-payload: |
            {"js_url": "https://cdn.jsdelivr.net/npm/@llamaindex/workflow-debugger@${{ env.VERSION }}/dist/app.js", "css_url": "https://cdn.jsdelivr.net/npm/@llamaindex/workflow-debugger@${{ env.VERSION }}/dist/app.css"}

