name: Deploy workflow-debugger

on:
  repository_dispatch:
    types: [deploy-workflow-debugger]
  push:
    branches: [main]
    paths:
      - "packages/workflow-debugger/**"
  workflow_dispatch: 
    inputs:
      version:
        description: "Version to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          owner: run-llama

      - name: Dispatch to workflows-py
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: run-llama/workflows-py
          event-type: debugger-assets-update
          client-payload: |
            {"js_url": "https://cdn.jsdelivr.net/npm/@llamaindex/workflow-debugger@${{ env.VERSION }}/dist/app.js", "css_url": "https://cdn.jsdelivr.net/npm/@llamaindex/workflow-debugger@${{ env.VERSION }}/dist/app.css"}

