name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting (with auto-fix)
        run: pnpm run lint:fix

      - name: Auto-fix PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/autofix-pr
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          add-paths: |
            packages/
            examples/
          check-name: "Lint"
          fix-command: "pnpm lint:fix"

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting (with auto-fix)
        run: pnpm run format

      - name: Auto-fix PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/autofix-pr
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          add-paths: |
            packages/
            examples/
          check-name: "Format"
          fix-command: "pnpm format"

  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, format]
    env:
      STORYBOOK_LLAMA_CLOUD_API_KEY: ${{ secrets.STORYBOOK_LLAMA_CLOUD_API_KEY }}
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:all

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/ui/coverage/lcov.info
          flags: unittests
          name: codecov-ui
          fail_ci_if_error: true
          verbose: true

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: |
          if [[ $(pnpm changeset status --since=origin/${{ github.base_ref }}) == *"No changesets present"* ]]; then
            echo "::error::No changeset found. Please run 'pnpm changeset' to add a changeset."
            exit 1
          fi
