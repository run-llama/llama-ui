name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Fix lint and format
        run: |
          pnpm run lint:fix
          pnpm run format

      - name: Auto-fix PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/autofix-pr
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          add-paths: |
            packages/
          check-name: "Code Quality"
          fix-command: "pnpm lint:fix && pnpm format"

  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [code-quality]
    env:
      STORYBOOK_LLAMA_CLOUD_API_KEY: ${{ secrets.STORYBOOK_LLAMA_CLOUD_API_KEY }}
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:all
      - run: pnpm run typecheck
      - run: pnpm run coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/ui/coverage/lcov.info
          flags: unittests
          name: codecov-ui
          fail_ci_if_error: true
          verbose: true

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: |
          if [[ $(pnpm changeset status --since=origin/${{ github.base_ref }}) == *"No changesets present"* ]]; then
            echo "::error::No changeset found. Please run 'pnpm changeset' to add a changeset."
            exit 1
          fi
